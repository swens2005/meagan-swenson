# Every push and pull request: validate the HTML, syntax-check the JS and run
# Lighthouse (accessibility, best practices and SEO must stay at 100).
# Pushes to main that pass are then deployed to codelaunch.nl over FTPS.
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Validate HTML
        run: npx --yes html-validate@11.16.1 index.html

      - name: Check JavaScript syntax
        run: node --check js/main.js

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

  deploy:
    name: Deploy to codelaunch.nl
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://codelaunch.nl/
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      # Skip cleanly (instead of failing) until the FTP secrets have been added
      - name: Check deployment secrets
        id: secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets are not all set, so nothing was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ready == 'true'

      # Uploads only files that changed since the last deploy (tracked in
      # .ftp-deploy-sync-state.json on the server). The FTP account's home
      # directory should be the site root, so server-dir is "./".
      - name: Upload to Namecheap over FTPS
        if: steps.secrets.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@3a9c65ae0fc12ac924ccef8afc26941cc43aad0b # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .htmlvalidate.json
            lighthouserc.json
            README.md
